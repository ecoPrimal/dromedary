# 🐪 Dromedary — Gaia's own reverse proxy + TLS surface
#
# The 17th primal. One hump. Carries her own water.
# Replaces Caddy (Go) with Pure Rust sovereign infrastructure.
#
# DNA sourced from:
#   beardog-acme   → ACME / Let's Encrypt lifecycle
#   songbird-tls   → Pure Rust TLS 1.3
#   skunkBat       → caddy_bridge pattern recognition
#   cellMembrane   → blackwall + selectivity
#   petalTongue    → compression (gzip, brotli)
#   nestGate       → axum HTTP server pattern

[workspace]
members = [
    "crates/dromedary-core",
    "crates/dromedary-acme",
    "crates/dromedary-routing",
    "crates/dromedary-blackwall",
    "crates/dromedary-static",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kevin Mok <kevin@primals.eco>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimal/dromedary"
homepage = "https://primals.eco"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48", features = [
    "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"
] }

# HTTP — axum + hyper (same versions as nestGate/biomeOS/songBird)
axum = { version = "0.8", features = ["json", "tokio", "ws"] }
hyper = { version = "1.0", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server", "server-auto"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "fs", "trace", "cors", "compression-gzip", "compression-br",
    "set-header", "catch-panic"
] }

# TLS — Pure Rust (same as bearDog)
rustls = { version = "0.23", default-features = false, features = [
    "custom-provider", "logging", "std", "tls12"
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-rustcrypto = { version = "0.0.2-alpha", git = "https://github.com/RustCrypto/rustls-rustcrypto" }
webpki-roots = "0.26"
rustls-pemfile = "2"

# ACME (cert lifecycle) — derived from beardog-acme
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
x509-cert = "0.2"
x509-parser = "0.16"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Crypto
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Config
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[package]
name = "dromedary"
description = "🐪 Gaia's sovereign reverse proxy — one hump, carries her own water"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
dromedary-core = { path = "crates/dromedary-core" }
dromedary-acme = { path = "crates/dromedary-acme" }
dromedary-routing = { path = "crates/dromedary-routing" }
dromedary-blackwall = { path = "crates/dromedary-blackwall" }
dromedary-static = { path = "crates/dromedary-static" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "dromedary"
path = "src/main.rs"

[lints]
workspace = true
