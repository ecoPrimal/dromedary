# 🐪 Dromedary — Gaia's static membrane server
# THE ORGANISM IS STATIC. Grey shadow. Data radiates.
# swarmVine IS the internal DNS. Dromedary IS the tower.

http_port = 80
https_port = 443
acme_email = "ops@primals.eco"
cert_dir = "/home/eastgate/.local/share/gaia/certs"

# ═══ SECURITY HEADERS ═══
[security_headers]
hsts = "max-age=63072000; includeSubDomains; preload"
content_type_options = "nosniff"
frame_options = "SAMEORIGIN"
referrer_policy = "strict-origin-when-cross-origin"
permissions_policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
custom = [
    ["X-Membrane-Wave", "240"],
    ["X-Organism", "Gaia"],
    ["X-Powered-By", "Dromedary/0.1.0 (Pure Rust)"],
]

# ═══ BLACKWALL ═══
[blackwall]
block_meta = true
blocked_agents = [
    "meta-externalagent", "facebookexternalhit", "FacebookBot",
    "WhatsApp", "Instagram", "Threads", "MetaAI",
]
blocked_cidrs = [
    "57.141.0.0/16", "69.63.176.0/20", "69.171.224.0/19",
    "157.240.0.0/16", "129.134.0.0/16", "163.70.128.0/17",
]

# ═══ SITES ═══

