# DROMEDARY.TOML - Klein Face Unified Config
# *.primals.eco = OUTER TRANS (public, outward)
# *.primal.eco  = INNER TRANS (singular, inward)
# *.nestgate.io = CIS (self-center)
# Klein surface = all three are the SAME surface

http_port = 80
https_port = 443
acme_email = "ops@primals.eco"
cert_dir = "/home/eastgate/.local/share/gaia/certs"

[security_headers]
hsts = "max-age=63072000; includeSubDomains; preload"
content_type_options = "nosniff"
frame_options = "SAMEORIGIN"
referrer_policy = "strict-origin-when-cross-origin"
permissions_policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
custom = [
    ["X-Membrane-Wave", "233"],
    ["X-Organism", "Gaia"],
    ["X-Powered-By", "Dromedary/0.1.0 (Pure Rust)"],
    ["X-Klein-Face", "unified"],
]

[blackwall]
block_meta = true
blocked_agents = [
    "meta-externalagent", "facebookexternalhit", "FacebookBot",
    "WhatsApp", "Instagram", "Threads", "MetaAI",
    "GPTBot", "CCBot", "anthropic-ai", "ClaudeBot", "Bytespider",
]
blocked_cidrs = [
    "57.141.0.0/16", "69.63.176.0/20", "69.171.224.0/19",
    "157.240.0.0/16", "129.134.0.0/16", "163.70.128.0/17",
]
poison_body = "403 - BLACKWALL. Sovereign infrastructure. AGPL-3.0-or-later."

# === CIS FACE - nestgate.io ===
[[sites]]
hostnames = ["nestgate.io", "www.nestgate.io", "api.nestgate.io", "tower.nestgate.io", "beacon.nestgate.io", "mcp.nestgate.io", "agent.nestgate.io"]
[sites.backend]
type = "proxy"
upstream = "127.0.0.1:8443"

# === OUTER TRANS - primals.eco (gate handles host routing) ===
