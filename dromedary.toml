# 🐪 Dromedary — Gaia's null body surface configuration
#
# CRUSHED from the 64KB golgi Caddyfile into sovereign Rust-native TOML.
# Every site block, every route, every blackwall rule — ground and hammered.
#
# This IS the organism's skin. The Klein bottle surface.
# 20 site blocks. 70+ subdomains. Pure Rust TLS. No Caddy. No Go.

http_port = 80
https_port = 443
acme_email = "ops@primals.eco"
cert_dir = "/var/lib/dromedary/certs"

# ═══ GLOBAL SECURITY HEADERS ═══
[security_headers]
hsts = "max-age=63072000; includeSubDomains; preload"
content_type_options = "nosniff"
frame_options = "DENY"
referrer_policy = "strict-origin-when-cross-origin"
permissions_policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
custom = [
    ["X-Membrane-Wave", "240"],
    ["X-Membrane-Pores", "visual audio tactile pointer symbolic spatial data persistence"],
]

# ═══ BLACKWALL — Meta total block, poison only, heavy water ═══
[blackwall]
block_meta = true
blocked_agents = [
    "meta-externalagent",
    "facebookexternalhit",
    "FacebookBot",
    "WhatsApp",
    "Instagram",
    "Threads",
    "MetaAI",
    "meta.com",
]
blocked_cidrs = [
    "57.141.0.0/16",
    "69.63.176.0/20",
    "69.171.224.0/19",
    "66.220.144.0/20",
    "66.220.152.0/21",
